<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EVILGINX // ACCESS</title>
<link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png?v=4">
<link rel="icon" type="image/png" sizes="16x16" href="/static/favicon-16.png?v=4">
<link rel="shortcut icon" href="/static/favicon.ico?v=4">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png?v=4">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0a0e17;--bg2:#111827;--bg3:#1a2332;
  --accent:#00ff88;--accent-dim:rgba(0,255,136,0.15);
  --cyan:#22d3ee;--red:#ef4444;
  --text:#f1f5f9;--text2:#94a3b8;--text3:#475569;
  --border:rgba(0,255,136,0.12);--border-h:rgba(0,255,136,0.3);
  --font:'Inter',sans-serif;--mono:'JetBrains Mono',monospace;
}
html,body{height:100%;overflow:hidden;background:var(--bg);font-family:var(--font);color:var(--text)}

.login-bg{
  position:fixed;inset:0;z-index:0;
  background:var(--bg);
  background-image:
    radial-gradient(circle at 20% 50%, rgba(0,255,136,0.04) 0%, transparent 50%),
    radial-gradient(circle at 80% 20%, rgba(34,211,238,0.04) 0%, transparent 50%),
    radial-gradient(circle at 60% 80%, rgba(167,139,250,0.03) 0%, transparent 50%);
}

.grid-pattern{
  position:fixed;inset:0;z-index:1;pointer-events:none;opacity:0.4;
  background-image:
    linear-gradient(rgba(0,255,136,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,255,136,0.03) 1px, transparent 1px);
  background-size:60px 60px;
}

.login-wrap{
  position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:10;
}

.login-box{
  width:420px;padding:48px 40px;
  background:rgba(17,24,39,0.8);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1px solid var(--border);
  border-radius:16px;
  animation:loginAppear 0.6s cubic-bezier(0.16,1,0.3,1);
  position:relative;overflow:hidden;
}
@keyframes loginAppear{
  from{opacity:0;transform:scale(0.95) translateY(20px)}
  to{opacity:1;transform:scale(1) translateY(0)}
}

.logo{text-align:center;margin-bottom:10px}
.logo h1{
  font-family:var(--font);font-size:32px;font-weight:700;
  letter-spacing:6px;
  background:linear-gradient(135deg,var(--accent),var(--cyan));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
}
.logo .ver{font-family:var(--mono);font-size:12px;color:#fff;letter-spacing:3px;margin-top:4px}
.logo-mark{
  display:block;width:108px;height:108px;object-fit:contain;
  margin:18px auto 2px;
  filter:drop-shadow(0 0 18px rgba(0,255,136,0.28)) drop-shadow(0 0 10px rgba(34,211,238,0.18));
}

.subtitle{
  text-align:center;font-size:13px;color:#fff;
  margin:14px 0 32px;letter-spacing:2px;
  padding:12px 0;
  border-top:1px solid var(--border);border-bottom:1px solid var(--border);
}

.field{margin-bottom:20px}
.field label{
  display:block;font-size:12px;font-weight:600;color:var(--accent);
  margin-bottom:8px;letter-spacing:1px;text-transform:uppercase;
}
.field input{
  width:100%;padding:14px 16px;
  background:var(--bg);
  border:1px solid var(--border);border-radius:8px;
  color:#fff;font-family:var(--mono);font-size:15px;
  outline:none;transition:border-color 0.3s,box-shadow 0.3s;
}
.field input:focus{
  border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(0,255,136,0.1);
}
.field input::placeholder{color:rgba(255,255,255,0.55)}
.field input:-webkit-autofill,.field input:-webkit-autofill:hover,.field input:-webkit-autofill:focus{-webkit-text-fill-color:#fff;-webkit-box-shadow:0 0 0 1000px var(--bg) inset;caret-color:#fff;transition:background-color 5000s ease-in-out 0s}

.btn{
  width:100%;padding:14px;
  background:var(--accent);color:var(--bg);
  font-family:var(--font);font-size:15px;font-weight:700;
  letter-spacing:3px;cursor:pointer;
  border:none;border-radius:8px;
  transition:all 0.25s;margin-top:12px;text-transform:uppercase;
}
.btn:hover{filter:brightness(1.15);transform:translateY(-1px)}
.btn:active{transform:scale(0.98)}
.btn.loading{pointer-events:none;opacity:0.6}

.error{
  color:var(--red);font-size:13px;text-align:center;
  margin-top:16px;min-height:20px;font-weight:500;
}

.footer{
  text-align:center;margin-top:28px;font-size:11px;
  color:#fff;letter-spacing:2px;
}
.credit{
  text-align:center;margin-top:10px;font-size:12px;font-weight:500;
  color:#f59e0b;letter-spacing:1px;
}
.credit span{
  color:var(--accent);font-weight:700;letter-spacing:1.5px;
}

@keyframes glow-pulse{
  0%,100%{opacity:0.4}50%{opacity:0.7}
}
.login-box::before{
  content:'';position:absolute;top:-1px;left:20%;right:20%;height:1px;
  background:linear-gradient(90deg,transparent,var(--accent),transparent);
  animation:glow-pulse 3s ease-in-out infinite;
}
</style>
</head>
<body>
<div class="login-bg"></div>
<div class="grid-pattern"></div>
<div class="login-wrap">
  <div class="login-box">
    <div class="logo">
      <h1>EVILGINX</h1>
      <div class="ver">v{{ panel_version }} — C2 Panel</div>
      <img class="logo-mark" src="/static/logo.png?v=4" alt="Evilginx">
    </div>
    <div class="subtitle">AUTHENTICATION REQUIRED</div>
    <form id="loginForm" autocomplete="off">
      <div class="field">
        <label>Username</label>
        <input type="text" id="username" placeholder="root" autofocus>
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="password" placeholder="••••••••••">
      </div>
      <button type="submit" class="btn" id="submitBtn">AUTHENTICATE</button>
    </form>
    <div id="error" class="error"></div>
    <div class="footer">ENCRYPTED SESSION // SECURE ACCESS</div>
    <div class="credit">Created by <span>ZynTarvo</span></div>
  </div>
</div>
<script>
document.getElementById('loginForm').addEventListener('submit',async e=>{
  e.preventDefault();
  const btn=document.getElementById('submitBtn');
  const err=document.getElementById('error');
  btn.classList.add('loading');btn.textContent='AUTHENTICATING...';err.textContent='';
  try{
    const r=await fetch('/login',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({username:document.getElementById('username').value,
        password:document.getElementById('password').value})});
    const d=await r.json();
    if(d.ok){btn.textContent='ACCESS GRANTED';btn.style.background='var(--accent)';
      setTimeout(()=>window.location='/',500);
    }else{err.textContent=d.error||'ACCESS DENIED';btn.classList.remove('loading');btn.textContent='AUTHENTICATE';}
  }catch(ex){err.textContent='CONNECTION FAILED';btn.classList.remove('loading');btn.textContent='AUTHENTICATE';}
});
</script>
</body>
</html>
